# 테스트: H2 를 MySQL 호환 모드로 띄우고 실제 Flyway 마이그레이션(V1, V2)을 그대로 적용한다.
spring:
  datasource:
    url: jdbc:h2:mem:konbip;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: true

konbip:
  seed:
    enabled: false
